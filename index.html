<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="description" content="AI Chat PWA with Gemini and Web Search" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>AI Chat</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>AI Chat <span id="version-tag" class="version-tag">v6</span></h1>
      <div class="header-actions">
        <button id="search-toggle" title="Toggle Web Search">&#128269;</button>
        <button id="settings-btn" title="Settings">&#9881;</button>
        <button id="install-btn" title="Install PWA" hidden>&#10515;</button>
      </div>
    </header>

    <main id="resizable-container">
      <section id="input-section">
        <div class="section-label">
          <span>Input</span>
          <div class="section-actions">
            <span id="search-badge" class="badge" hidden>Search ON</span>
            <button id="send-btn" title="Send">&#10148;</button>
          </div>
        </div>
        <textarea id="user-input" placeholder="Type your message here..."></textarea>
      </section>

      <div id="divider" title="Drag to resize"></div>

      <section id="response-section">
        <div class="section-label">
          <span>Response</span>
          <div class="section-actions">
            <button id="debug-btn" title="Toggle Debug">&#128065;</button>
            <button id="clear-btn" title="Clear">&#10005;</button>
          </div>
        </div>
        <div id="response-area">
          <div class="placeholder">AI response will appear here...</div>
        </div>
      </section>
    </main>
  </div>

  <div id="settings-modal" class="modal" hidden>
    <div class="modal-content">
      <h2>Settings</h2>
      <div class="setting-row">
        <label for="provider">Provider</label>
        <select id="provider">
          <option value="kilo">Kilo Gateway</option>
          <option value="gemini">Google Gemini</option>
          <option value="openai">OpenAI / Compatible</option>
        </select>
      </div>
      <div class="setting-row">
        <label for="api-key">API Key</label>
        <input type="password" id="api-key" placeholder="Enter your API key" />
      </div>
      <div class="setting-row" id="api-url-row" hidden>
        <label for="api-url">API Endpoint</label>
        <input type="text" id="api-url" placeholder="https://api.kilo.ai/api/gateway/chat/completions" />
      </div>
      <div class="setting-row">
        <label>Model</label>
        <div id="model-list" class="model-list"></div>
      </div>
      <div class="setting-row">
        <label for="system-prompt">System Prompt</label>
        <textarea id="system-prompt" placeholder="You are a helpful assistant."></textarea>
      </div>
      <div class="setting-row" id="cors-row">
        <label for="use-cors-proxy">Use CORS Proxy</label>
        <select id="use-cors-proxy">
          <option value="none">None</option>
          <option value="corsproxy.io">corsproxy.io</option>
          <option value="allorigins">allorigins.win</option>
        </select>
      </div>
      <div class="modal-actions">
        <button id="reset-data" class="danger">Reset All Data</button>
        <div class="spacer"></div>
        <button id="close-settings">Cancel</button>
        <button id="save-settings">Save</button>
      </div>
    </div>
  </div>

  <div id="debug-panel" hidden>
    <div class="debug-header">
      <span>Debug Log <span id="version-tag-debug" class="version-tag"></span></span>
      <button id="debug-clear">Clear</button>
    </div>
    <div id="debug-content"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
