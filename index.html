<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="description" content="AI Chat PWA" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>AI Chat</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>AI Chat</h1>
      <div class="header-actions">
        <button id="settings-btn" title="Settings">&#9881;</button>
        <button id="install-btn" title="Install PWA" hidden>&#10515;</button>
      </div>
    </header>

    <main id="resizable-container">
      <section id="input-section">
        <div class="section-label">
          <span>Input</span>
          <button id="send-btn" title="Send">&#10148;</button>
        </div>
        <textarea id="user-input" placeholder="Type your message here..."></textarea>
      </section>

      <div id="divider" title="Drag to resize"></div>

      <section id="response-section">
        <div class="section-label">
          <span>Response</span>
          <button id="clear-btn" title="Clear">&#10005;</button>
        </div>
        <div id="response-area">
          <div class="placeholder">AI response will appear here...</div>
        </div>
      </section>
    </main>
  </div>

  <div id="settings-modal" class="modal" hidden>
    <div class="modal-content">
      <h2>Settings</h2>
      <div class="setting-row">
        <label for="api-url">API Endpoint</label>
        <input type="text" id="api-url" placeholder="https://api.openai.com/v1/chat/completions" />
      </div>
      <div class="setting-row">
        <label for="api-key">API Key</label>
        <input type="password" id="api-key" placeholder="sk-..." />
      </div>
      <div class="setting-row">
        <label for="model">Model</label>
        <input type="text" id="model" placeholder="gpt-4o-mini" />
      </div>
      <div class="setting-row">
        <label for="system-prompt">System Prompt</label>
        <textarea id="system-prompt" placeholder="You are a helpful assistant."></textarea>
      </div>
      <div class="modal-actions">
        <button id="save-settings">Save</button>
        <button id="close-settings">Cancel</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
